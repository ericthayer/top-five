/** Build a constructable stylesheet for a shadow root. */
function css(text) {
    const s = new CSSStyleSheet();
    s.replaceSync(text);
    return s;
}
/** createElement with attributes and text. Text always goes through textContent. */
function el(tag, attrs = {}, text) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs))
        node.setAttribute(k, v);
    if (text !== undefined)
        node.textContent = text;
    return node;
}
/** Clone a static, trusted template string into a fragment. Never pass data through this. */
function fragment(markup) {
    const t = document.createElement('template');
    t.innerHTML = markup;
    return t.content;
}
function reducedMotion() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function centerOf(node) {
    const r = node.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

/**

const inkCss = /* css */ `
[data-ink] { --pad: clamp(14px, 6cqmin, 30px); }
[data-ink="blue"]   { --bg: var(--riso-blue);   --fg: var(--on-dark);  --ink2: var(--riso-pink); }

[data-ink="purple"] { --bg: var(--riso-purple); --fg: var(--on-dark);  --ink2: var(--riso-yellow); }
[data-ink="yellow"] { --bg: var(--riso-yellow); --fg: var(--on-light); --ink2: var(--riso-blue); }
[data-ink="pink"]   { --bg: var(--riso-pink);   --fg: var(--on-light); --ink2: var(--riso-yellow); }
[data-ink="teal"]   { --bg: var(--riso-teal);   --fg: var(--on-dark);  --ink2: var(--riso-yellow); }
[data-ink="green"]  { --bg: var(--riso-green);  --fg: var(--on-light); --ink2: var(--riso-pink); }
[data-ink="red"]    { --bg: var(--riso-red);    --fg: var(--on-light); --ink2: var(--riso-yellow); }

[data-motif="halftone"] { --shape: 28px 34cqmin 28px 28px; }
[data-motif="zigzag"]   { --shape: 999px 999px 28px 28px; }
[data-motif="stars"]    { --shape: 28px; }
[data-motif="record"]   { --shape: 28px 46cqmin 28px 28px; }
[data-motif="glyph"]    { --shape: 6px; }
[data-motif="lanes"]    { --shape: 999px; }
[data-motif="scallop"]  { --shape: 64px 28px 28px 28px; }
[data-motif="checker"]  { --shape: 0; }

/* corner-shape plates (Chromium 139+). Other engines keep the rounded silhouettes above. */
@supports (corner-shape: squircle) {
  [data-motif="stars"]   { --shape: 28px 22cqmin 28px 28px; --corner: round bevel round round; }
  [data-motif="glyph"]   { --shape: 26px; --corner: scoop; --pad: clamp(30px, 6cqmin, 36px); }
  [data-motif="scallop"] { --shape: 72px 44px 44px 44px; --corner: squircle; }
  [data-motif="checker"] { --shape: 20px; --corner: notch; --pad: clamp(28px, 7cqmin, 34px); }
  [data-motif="halftone"] { --shape: 40px 34cqmin 40px 40px; --corner: squircle round squircle squircle; }

const tileMarkup = /* html */ `
<article class="tile" lang="en">
  <div class="motif-box" aria-hidden="true"><div class="motif"></div></div>
  <header class="meta">
    <span class="cat"></span>
  </header>

/** One genre plate on the board. Dispatches `t5-open` when activated. */
class T5Tile extends HTMLElement {
    #genre = null;
    #root;
    constructor() {
        super();
        this.#root = this.attachShadow({ mode: 'open' });
        this.#root.adoptedStyleSheets = [tileStyles];
        this.#root.append(fragment(tileMarkup));
        this.#button.addEventListener('click', () => this.#open());
    }
    get genre() { return this.#genre; }
    set genre(value) {
        this.#genre = value;
        this.#render();
    }
    focus(options) { this.#button.focus(options); }
    get #button() {
        return this.#root.querySelector('button');
    }
    #open() {
        if (!this.#genre)
            return;
        this.dispatchEvent(new CustomEvent('t5-open', {
            bubbles: true, composed: true,
            detail: { id: this.#genre.id, origin: centerOf(this) },
        }));
    }
    #render() {
        const g = this.#genre;
        if (!g)
            return;
        const article = this.#root.querySelector('article');
        article.dataset['ink'] = g.ink;
        article.dataset['motif'] = g.motif;
        this.setAttribute('area', g.area);
        this.#root.querySelector('.cat').textContent = g.category;
        this.#button.textContent = g.title;
        this.#button.setAttribute('aria-label', `Top 5 ${g.title}. Number one: ${g.picks[0].name}`);
        const list = this.#root.querySelector('ol');
        list.replaceChildren(...g.picks.map((p, i) => {
            const li = el('li');
            li.append(el('span', { class: 'rank', 'aria-hidden': 'true' }, String(i + 1)), el('span', {}, p.name));
            return li;
        }));
    }
}
customElements.define('t5-tile', T5Tile);

/** Modal detail view for one genre. Dispatches `t5-step` for prev/next and arrow keys. */
class T5Sheet extends HTMLElement {
    #root;
    #dialog;
    #article;
    constructor() {
        super();
        this.#root = this.attachShadow({ mode: 'open' });
        this.#root.adoptedStyleSheets = [sheetStyles];
        this.#root.append(fragment(sheetMarkup));
        this.#dialog = this.#root.querySelector('dialog');
        this.#article = this.#root.querySelector('article');
        this.#root.querySelector('.close')?.addEventListener('click', () => this.close());
        this.#dialog.addEventListener('click', (e) => { if (e.target === this.#dialog)
            this.close(); });
        this.#dialog.addEventListener('close', () => this.dispatchEvent(new Event('close')));
        this.#dialog.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft')
                this.#step(-1);
            if (e.key === 'ArrowRight')
                this.#step(1);
        });
        for (const b of this.#root.querySelectorAll('footer button')) {
            b.addEventListener('click', () => this.#step(b.dataset['dir'] === '-1' ? -1 : 1));
        }
    }
    get isOpen() { return this.#dialog.open; }
    show(genre, pos, origin) {
        this.#render(genre, pos);
        if (!this.#dialog.open)
            this.#dialog.showModal();
        this.#reveal(origin);
    }
    close() { this.#dialog.close(); }
    #step(dir) {
        this.dispatchEvent(new CustomEvent('t5-step', { detail: { dir } }));
    }
    #reveal(origin) {
        if (reducedMotion())
            return;
        const r = this.#article.getBoundingClientRect();
        const at = `at ${origin.x - r.left}px ${origin.y - r.top}px`;
        this.#article.animate([{ clipPath: `circle(0 ${at})` }, { clipPath: `circle(150% ${at})` }], { duration: 520, easing: 'cubic-bezier(.2, .9, .2, 1)' });
    }
    #render(g, pos) {
        const a = this.#article;
        a.dataset['ink'] = g.ink;
        a.dataset['motif'] = g.motif;
        a.scrollTop = 0;
        a.querySelector('.cat').textContent = g.category;
        a.querySelector('.title').textContent = g.title;
        a.querySelector('ol').replaceChildren(...g.picks.map((p, i) => {
            const body = el('div');
            body.append(el('p', { class: 'name' }, p.name), el('p', { class: 'note' }, p.note));
            const li = el('li');
            li.append(el('span', { class: 'num', 'aria-hidden': 'true' }, String(i + 1)), body);
            return li;
        }));
        const [prevBtn, nextBtn] = a.querySelectorAll('footer button');
        this.#label(prevBtn, `Previous: ${pos.prev.title}`, pos.prev.title);
        this.#label(nextBtn, `Next: ${pos.next.title}`, pos.next.title);
        a.querySelector('output').textContent = `${pos.index + 1} / ${pos.total}`;
    }
    #label(btn, aria, text) {
        if (!btn)
            return;
        btn.setAttribute('aria-label', aria);
        btn.querySelector('.label').textContent = text;
    }
}

// ---- t5-board.ts
/**
 * Page shell. Light DOM so page.css owns the bento grid and its container-query layouts.
 * Owns the only piece of state: which genre the sheet shows.
 */
class T5Board extends HTMLElement {
    #genres = [];
    #active = -1;
    #returnFocus = null;
    #grid = el('main', { class: 'board-grid', 'aria-label': 'Top 5 genres' });
    #sheet = document.createElement('t5-sheet');
    constructor() {
        super();
        this.addEventListener('t5-open', (e) => this.#open(this.#indexOf(e.detail.id), e.detail.origin));
        this.addEventListener('t5-random', (e) => this.#open(this.#randomIndex(), e.detail.origin, false));
        this.#sheet.addEventListener('t5-step', (e) => this.#step(e.detail.dir));
        this.#sheet.addEventListener('close', () => {
            this.#returnFocus?.focus();
            this.#active = -1;
        });
    }
    set genres(value) {
        this.#genres = value;
        this.#render();
    }
    connectedCallback() {
        if (!this.#grid.isConnected)
            this.append(this.#grid, this.#sheet);
    }
    #render() {
        const tiles = this.#genres.map((g) => {
            const tile = document.createElement('t5-tile');
            tile.genre = g;
            return tile;
        });
        this.#grid.replaceChildren(document.createElement('t5-masthead'), ...tiles);
    }
    #indexOf(id) {
        return this.#genres.findIndex((g) => g.id === id);
    }
    #randomIndex() {
        const n = this.#genres.length;
        if (n < 2)
            return 0;
        if (this.#active < 0)
            return Math.floor(Math.random() * n);
        const pick = Math.floor(Math.random() * (n - 1));
        return pick >= this.#active ? pick + 1 : pick;
    }
    #tileAt(i) {
        return this.#grid.querySelectorAll('t5-tile')[i] ?? null;
    }
    #open(i, origin, fromTile = true) {
        const genre = this.#genres[i];
        if (!genre)
            return;
        if (!this.#sheet.isOpen)
            this.#returnFocus = fromTile ? this.#tileAt(i) : null;
        this.#active = i;
        const n = this.#genres.length;
        const prev = this.#genres[(i - 1 + n) % n];
        const next = this.#genres[(i + 1) % n];
        this.#sheet.show(genre, { index: i, total: n, prev, next }, origin);
    }
    #step(dir) {
        const n = this.#genres.length;
        const i = (this.#active + dir + n) % n;
        this.#returnFocus = this.#tileAt(i);
        this.#open(i, { x: dir > 0 ? window.innerWidth : 0, y: window.innerHeight / 2 });
    }
}
customElements.define('t5-board', T5Board);
